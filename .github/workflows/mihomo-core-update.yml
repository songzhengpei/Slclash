name: Mihomo Core Update

on:
  workflow_dispatch:
    inputs:
      force:
        description: "Force re-validation of the current core (never downgrades; ignored for DIVERGED)"
        required: false
        default: false
        type: boolean
      dry_run:
        description: "Validate the decision and validation path without pushing, opening PRs, merging, tagging, or releasing"
        required: false
        default: false
        type: boolean
  schedule:
    - cron: "20 3 * * 1"

concurrency:
  group: mihomo-core-update
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  update-core:
    name: Check Mihomo relationship and open beta review
    runs-on: ubuntu-latest

    steps:
      # Phase 1.1 safety fuse: the updater always inspects and upgrades the
      # BETA core, no matter which ref triggered the workflow. Scheduled runs
      # execute the workflow definition from the default branch (main), but
      # the working tree must be beta.
      - name: Checkout beta
        uses: actions/checkout@v4
        with:
          ref: beta
          submodules: recursive
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify updater relationship contract
        shell: bash
        run: bash scripts/test_mihomo_core_relationship_contract.sh

      - name: Fetch submodule tags
        shell: bash
        run: |
          git -C core/Clash.Meta remote add metacubex https://github.com/MetaCubeX/mihomo.git 2>/dev/null || \
            git -C core/Clash.Meta remote set-url metacubex https://github.com/MetaCubeX/mihomo.git
          git -C core/Clash.Meta fetch --tags origin 2>/dev/null || true
          git -C core/Clash.Meta fetch --tags --force metacubex 2>/dev/null || true

      - name: Resolve core relationship
        id: rel
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # Relationship is decided by exact commit SHAs and merge-base
          # ancestry, never by dates or tag-string comparison.
          bash scripts/mihomo-core-relationship.sh core/Clash.Meta > /tmp/rel.txt
          cat /tmp/rel.txt
          # Publish every KEY=VALUE line as a step output.
          while IFS='=' read -r key value; do
            [ -n "$key" ] && echo "$key=$value" >> "$GITHUB_OUTPUT"
          done < /tmp/rel.txt

      - name: Decide update action
        id: decision
        shell: bash
        env:
          REL: ${{ steps.rel.outputs.relationship_to_stable }}
          FORCE: ${{ inputs.force }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail
          echo "relationship_to_stable=$REL"
          echo "force=$FORCE"
          echo "dry_run=$DRY_RUN"

          case "$REL" in
            DIVERGED)
              echo "action=fail_closed" >> "$GITHUB_OUTPUT"
              ;;
            BEHIND_STABLE)
              echo "action=upgrade_stable" >> "$GITHUB_OUTPUT"
              ;;
            EXACT_STABLE|AHEAD_OF_STABLE)
              if [ "$FORCE" = "true" ] || [ "$DRY_RUN" = "true" ]; then
                echo "action=validate_current" >> "$GITHUB_OUTPUT"
              else
                echo "action=noop" >> "$GITHUB_OUTPUT"
              fi
              ;;
            *)
              echo "Unknown relationship: $REL" >&2
              exit 1
              ;;
          esac

      - name: Fail closed on diverged history
        if: ${{ steps.decision.outputs.action == 'fail_closed' }}
        shell: bash
        run: |
          echo "::error::Core history is DIVERGED from the latest stable release. " \
            "No submodule change, push, or PR was performed. Manual review required."
          exit 1

      - name: Setup Go for validation
        if: ${{ steps.decision.outputs.action == 'upgrade_stable' || steps.decision.outputs.action == 'validate_current' }}
        uses: actions/setup-go@v5
        with:
          go-version: "1.24.0"
          cache-dependency-path: |
            core/go.sum

      - name: Update Mihomo submodule to stable
        if: ${{ steps.decision.outputs.action == 'upgrade_stable' }}
        id: update
        shell: bash
        run: |
          set -euo pipefail

          LATEST_TAG="${{ steps.rel.outputs.latest_stable_tag }}"
          BRANCH="codex/mihomo-core-${LATEST_TAG}"
          DRY_RUN="${{ inputs.dry_run == true }}"

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git switch -c "$BRANCH"

          git -C core/Clash.Meta remote add metacubex https://github.com/MetaCubeX/mihomo.git 2>/dev/null || \
            git -C core/Clash.Meta remote set-url metacubex https://github.com/MetaCubeX/mihomo.git
          git -C core/Clash.Meta fetch --tags --force metacubex

          git -C core/Clash.Meta checkout -q "$LATEST_TAG"

          (cd core && go mod tidy)

          NEW_COMMIT="$(git -C core/Clash.Meta rev-parse --short=12 HEAD)"

          git add core/Clash.Meta core/go.mod core/go.sum
          if git diff --cached --quiet; then
            echo "No update changes were produced."
            echo "mihomo_commit=$NEW_COMMIT" >> "$GITHUB_OUTPUT"
            echo "dry_run=$DRY_RUN" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ "$DRY_RUN" = "true" ]; then
            echo "Dry run enabled. Leaving update changes uncommitted for validation."
            git diff --cached --stat
            echo "mihomo_commit=$NEW_COMMIT" >> "$GITHUB_OUTPUT"
            echo "dry_run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git commit -m "chore: update mihomo core to $LATEST_TAG"

          echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"
          echo "mihomo_commit=$NEW_COMMIT" >> "$GITHUB_OUTPUT"
          echo "dry_run=false" >> "$GITHUB_OUTPUT"

      - name: Set up Java for validation
        if: ${{ steps.decision.outputs.action == 'upgrade_stable' || steps.decision.outputs.action == 'validate_current' }}
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Flutter for validation
        if: ${{ steps.decision.outputs.action == 'upgrade_stable' || steps.decision.outputs.action == 'validate_current' }}
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.41.9
          cache: true

      - name: Setup NDK for validation
        if: ${{ steps.decision.outputs.action == 'upgrade_stable' || steps.decision.outputs.action == 'validate_current' }}
        id: setup_ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r28c
          add-to-path: true
          link-to-sdk: true

      # Validates the checked-out core: the pinned stable for
      # upgrade_stable, the CURRENT (possibly ahead-of-stable) core for
      # validate_current. Never checks out an older stable when current is
      # ahead, and never overwrites a diverged current.
      - name: Validate core
        if: ${{ steps.decision.outputs.action == 'upgrade_stable' || steps.decision.outputs.action == 'validate_current' }}
        shell: bash
        env:
          ANDROID_NDK: ${{ steps.setup_ndk.outputs.ndk-path }}
          APP_ENV: stable
          PROJECT_DIR: ${{ github.workspace }}
          ACTION: ${{ steps.decision.outputs.action }}
          CURRENT_SHA: ${{ steps.rel.outputs.current_sha }}
          LATEST_TAG: ${{ steps.rel.outputs.latest_stable_tag }}
        run: |
          set -euo pipefail

          flutter pub get
          (
            cd plugins/setup/buildkit/build_tool
            dart pub get
            dart run bin/build_tool.dart \
              --root-dir "$GITHUB_WORKSPACE" patch-mihomo
          )
          # Keep analyzer errors blocking while allowing the repository's existing
          # warning/info baseline to be handled independently of core updates.
          flutter analyze --no-fatal-warnings --no-fatal-infos
          flutter test test/mihomo/runtime_config_regression_test.dart
          flutter test test/mihomo/source_config_preservation_test.dart
          flutter test test/mihomo/runtime_config_ownership_test.dart
          flutter test test/models/profile_atomic_write_test.dart
          flutter test test/core/controller_test.dart
          flutter test test/mihomo/structural_config_diff_test.dart
          flutter test test/mihomo/script_source_preservation_test.dart
          flutter test test/mihomo/e2e_compatibility_test.dart

          cd core
          go mod tidy
          git diff --exit-code go.mod go.sum
          cd ..

          # The wrapper is Android-specific and cannot be tested as a Linux
          # executable. Test the patched Mihomo package here; the arm64 build
          # below validates the complete wrapper and native library.
          (cd core/Clash.Meta && go test ./tunnel/statistic)
          (cd core && go test ./configfixture)

          flutter build apk --debug --target-platform android-arm64

          CHECKED_OUT="$(git -C core/Clash.Meta rev-parse HEAD)"
          if [ "$ACTION" = "upgrade_stable" ]; then
            ACTUAL_VERSION="$(git -C core/Clash.Meta describe --tags --abbrev=0)"
            if [ "$ACTUAL_VERSION" != "$LATEST_TAG" ]; then
              echo "Core version mismatch: expected $LATEST_TAG, got $ACTUAL_VERSION"
              exit 1
            fi
            echo "Core update validation completed for $ACTUAL_VERSION."
          else
            # validate_current: the submodule must still be the current SHA,
            # proving no downgrade or overwrite happened.
            if [ "$CHECKED_OUT" != "$CURRENT_SHA" ]; then
              echo "Core changed during validate_current: expected $CURRENT_SHA, got $CHECKED_OUT"
              exit 1
            fi
            echo "Current core validation completed for $CHECKED_OUT."
          fi

      - name: 生成内核升级评估
        if: ${{ steps.decision.outputs.action == 'upgrade_stable' }}
        id: review
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          CURRENT_SHA: ${{ steps.rel.outputs.current_sha }}
          LATEST_SHA: ${{ steps.rel.outputs.latest_stable_sha }}
          LATEST_TAG: ${{ steps.rel.outputs.latest_stable_tag }}
        run: |
          set -euo pipefail

          CHANGED_FILES="$(git -C core/Clash.Meta diff --name-only "$CURRENT_SHA" "$LATEST_SHA")"
          COMMIT_COUNT="$(git -C core/Clash.Meta rev-list --count "$CURRENT_SHA..$LATEST_SHA")"
          COMMITS="$(git -C core/Clash.Meta log --no-merges --format='- `%h` %s' "$CURRENT_SHA..$LATEST_SHA" | sed -n '1,80p')"
          RELEASE_BODY="$(gh api "repos/MetaCubeX/mihomo/releases/tags/$LATEST_TAG" --jq '.body // ""' 2>/dev/null || true)"
          RELEASE_EXCERPT="$(printf '%s\n' "$RELEASE_BODY" | sed -n '1,80p')"

          REVIEW_TEXT="$(printf '%s\n%s\n' "$RELEASE_BODY" "$COMMITS" | tr '[:upper:]' '[:lower:]')"
          CONFIG_FILES="$(printf '%s\n' "$CHANGED_FILES" | grep -E '^(config/|dns/|rules/|provider/|component/(trie|geodata|resolver)/)' || true)"
          RUNTIME_FILES="$(printf '%s\n' "$CHANGED_FILES" | grep -E '^(tunnel/|listener/|adapter/|component/dialer/|transport/)' || true)"
          PRODUCT_FILES="$(printf '%s\n' "$CHANGED_FILES" | grep -E '^(config/|adapter/(outbound|inbound)/|listener/|provider/|dns/)' || true)"

          BREAKING_SIGNAL="$(printf '%s\n' "$REVIEW_TEXT" | grep -E -m1 'breaking|incompatib|deprecat|rename(d)?[^[:alnum:]]*(field|option|config|api|schema)|remove(d)?[^[:alnum:]]*(field|option|config|api|schema|support)' || true)"
          FEATURE_SIGNAL="$(printf '%s\n' "$REVIEW_TEXT" | grep -E -m1 '(^|[^[:alnum:]])(add|added|support|supports|supported|introduce|introduced|new feature|implement|implemented|enable|enabled)([^[:alnum:]]|$)' || true)"

          CONCLUSION="可直接合并"
          CODE_ACTION="无需修改 Slclash 代码"
          UI_ACTION="无需新增或删减界面"
          RISK="低"
          REASON="全部兼容性测试和 Android arm64 构建通过，未检测到需要额外处理的上游兼容性信号。"

          if [ -n "$BREAKING_SIGNAL" ] && { [ -n "$CONFIG_FILES" ] || [ -n "$RUNTIME_FILES" ]; }; then
            CONCLUSION="建议修改后合并"
            CODE_ACTION="需要人工复核受影响代码；如确认上游契约发生变化，应先完成 Slclash 适配"
            UI_ACTION="先完成代码兼容性判断，再决定是否需要界面调整"
            RISK="高"
            REASON="上游说明或提交中出现删除、重命名、弃用或不兼容信号，并且触及配置或运行时敏感路径。"
          elif [ -n "$FEATURE_SIGNAL" ] && [ -n "$PRODUCT_FILES" ]; then
            CONCLUSION="建议评估产品和界面后合并"
            CODE_ACTION="当前自动兼容性验证已通过，暂未发现必须修改的 Slclash 代码"
            UI_ACTION="需要评估新能力是否应在 Slclash 中增加、删减或调整界面入口；也可以明确选择不暴露"
            RISK="中"
            REASON="上游存在新增或扩展能力信号，并且触及配置、协议、Provider、DNS 或入站能力等产品表面。"
          elif [ -n "$CONFIG_FILES" ] || [ -n "$RUNTIME_FILES" ]; then
            RISK="中"
            REASON="自动验证全部通过，但上游修改触及配置或运行时敏感路径；可以进入 Beta，但建议重点做对应真机回归。"
          fi

          {
            echo "conclusion=$CONCLUSION"
            echo "code_action=$CODE_ACTION"
            echo "ui_action=$UI_ACTION"
            echo "risk=$RISK"
            echo "commit_count=$COMMIT_COUNT"
          } >> "$GITHUB_OUTPUT"

          REPORT_FILE="$RUNNER_TEMP/mihomo-upgrade-review.md"
          {
            echo "## 自动升级评估"
            echo ""
            echo "> **结论：$CONCLUSION**"
            echo ""
            echo "- 风险等级：$RISK"
            echo "- 代码修改建议：$CODE_ACTION"
            echo "- 产品/界面建议：$UI_ACTION"
            echo "- 判断依据：$REASON"
            echo "- 上游提交数量：$COMMIT_COUNT"
            echo ""
            echo "### 自动验证"
            echo ""
            echo "- 配置回归、source preservation、DNS/TUN ownership：通过"
            echo "- Script structural diff / source preservation：通过"
            echo "- RawConfig / JSON bridge / E2E compatibility：通过"
            echo "- Go 检查与 Android arm64 构建：通过"
            echo ""
            echo "### 上游提交"
            echo ""
            if [ -n "$COMMITS" ]; then
              printf '%s\n' "$COMMITS"
            else
              echo "- 未取得提交列表"
            fi
            echo ""
            echo "### 重点变更文件"
            echo ""
            if [ -n "$CHANGED_FILES" ]; then
              printf '%s\n' "$CHANGED_FILES" | sed -n '1,80p' | sed 's/^/- `/' | sed 's/$/`/'
            else
              echo "- 未检测到文件变化"
            fi
            echo ""
            echo "### Mihomo 发布说明摘录"
            echo ""
            if [ -n "$RELEASE_EXCERPT" ]; then
              printf '%s\n' "$RELEASE_EXCERPT"
            else
              echo "官方 release 未提供说明。"
            fi
            echo ""
            echo "### 人工决策"
            echo ""
            case "$CONCLUSION" in
              "可直接合并")
                echo "自动护栏未发现阻塞项。可以合入 Beta，再按正常流程进行 Beta Release、真机稳定性测试，然后 beta → main。"
                ;;
              "建议修改后合并")
                echo "不要直接合入 Beta。先审查上游 breaking/deprecation 信号与敏感路径，必要时完成代码适配并重新跑完整护栏。"
                ;;
              *)
                echo "Core 本身已通过兼容性验证，但存在新产品能力信号。请先决定 Slclash 是否需要暴露、隐藏或调整相关界面；决定后再合入 Beta。"
                ;;
            esac
          } > "$REPORT_FILE"

          echo "report_file=$REPORT_FILE" >> "$GITHUB_OUTPUT"

      - name: Push validated update branch
        if: ${{ steps.update.outputs.branch != '' && inputs.dry_run != true }}
        shell: bash
        run: |
          git push --force-with-lease origin "${{ steps.update.outputs.branch }}"

      - name: Open pull request
        if: ${{ steps.update.outputs.branch != '' && inputs.dry_run != true }}
        id: pr
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          BRANCH="${{ steps.update.outputs.branch }}"
          TITLE="Mihomo 内核更新 ${{ steps.rel.outputs.latest_stable_tag }}：${{ steps.review.outputs.conclusion }}"

          BODY_FILE="$(mktemp)"
          cat > "$BODY_FILE" <<EOF
          ## Mihomo 内核更新

          - 当前版本：${{ steps.rel.outputs.nearest_release_tag }}（${{ steps.rel.outputs.current_sha }}）
          - 目标版本：${{ steps.rel.outputs.latest_stable_tag }}（${{ steps.update.outputs.mihomo_commit }}）
          - 关系：当前 Core 落后于最新稳定版，目标版本是当前版本的后继提交

          本次更新直接使用官方 \`MetaCubeX/mihomo\` 稳定版 tag。
          在创建这个 Draft PR 之前，已经完成 Slclash 配置兼容性测试、Script preservation、RawConfig E2E、Go 检查和 Android arm64 构建验证。

          EOF
          cat "${{ steps.review.outputs.report_file }}" >> "$BODY_FILE"

          EXISTING_PR="$(gh pr list --head "$BRANCH" --base beta --state open --json number --jq '.[0].number // empty')"
          if [ -n "$EXISTING_PR" ]; then
            PR_NUMBER="$EXISTING_PR"
            gh pr edit "$PR_NUMBER" --title "$TITLE" --body-file "$BODY_FILE"
          else
            PR_URL="$(gh pr create --draft --base beta --head "$BRANCH" --title "$TITLE" --body-file "$BODY_FILE")"
            PR_NUMBER="$(echo "$PR_URL" | grep -oE '[0-9]+$')"
          fi

          echo "pr_number=$PR_NUMBER" >> "$GITHUB_OUTPUT"
          echo "PR #$PR_NUMBER 已创建或更新"

      - name: Summary
        if: always()
        shell: bash
        env:
          REL: ${{ steps.rel.outputs.relationship_to_stable }}
          ACTION: ${{ steps.decision.outputs.action }}
          CURRENT_SHA: ${{ steps.rel.outputs.current_sha }}
          STABLE_TAG: ${{ steps.rel.outputs.latest_stable_tag }}
          STABLE_SHA: ${{ steps.rel.outputs.latest_stable_sha }}
          ALPHA_SHA: ${{ steps.rel.outputs.latest_alpha_sha }}
          REL_ALPHA: ${{ steps.rel.outputs.relationship_to_alpha }}
          REVIEW: ${{ steps.review.outputs.conclusion }}
          REVIEW_RISK: ${{ steps.review.outputs.risk }}
        run: |
          {
            echo "## Mihomo 内核更新摘要"
            echo ""
            echo "- 当前 Core：$CURRENT_SHA"
            echo "- 最新稳定版：$STABLE_TAG ($STABLE_SHA)"
            echo "- 与稳定版关系：$REL"
            echo "- 最新 Alpha：$ALPHA_SHA"
            echo "- 与 Alpha 关系：$REL_ALPHA"
            echo ""
            case "$ACTION" in
              fail_closed)
                echo "- 状态：已阻塞。Core 历史与稳定版分叉，未修改 submodule、未 push、未创建 PR，需要人工审查。"
                ;;
              noop)
                echo "- 状态：无需更新。"
                if [ "$REL" = "AHEAD_OF_STABLE" ]; then
                  echo "- 当前 Core 领先于最新稳定版，已拒绝自动降级。"
                fi
                ;;
              validate_current)
                echo "- 状态：当前 Core 已重新验证 ($CURRENT_SHA)。"
                echo "- 未降级、未创建 PR。"
                ;;
              upgrade_stable)
                echo "- 状态：目标稳定版已通过自动验证。"
                if [ -n "$REVIEW" ]; then
                  echo "- 自动评估：$REVIEW"
                  echo "- 风险等级：$REVIEW_RISK"
                fi
                if [ "${{ inputs.dry_run }}" = "true" ]; then
                  echo "- Dry run：仅验证，不 push、不创建 PR、不打 tag、不发布。"
                else
                  echo "- PR：#${{ steps.pr.outputs.pr_number }}"
                  echo "- 下一步：按 PR 中的中文结论决定直接合并、先修改，或先做产品/界面决策。"
                fi
                ;;
            esac
          } >> "$GITHUB_STEP_SUMMARY"
