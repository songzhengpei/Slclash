name: Mihomo Core Update

on:
  workflow_dispatch:
    inputs:
      force:
        description: "Create an update PR even when the recorded Mihomo version matches latest stable"
        required: false
        default: false
        type: boolean
      dry_run:
        description: "Validate the update/build path without pushing, opening PRs, merging, tagging, or releasing"
        required: false
        default: false
        type: boolean
  schedule:
    - cron: "20 3 * * 1"

concurrency:
  group: mihomo-core-update
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  update-core:
    name: Check Mihomo stable and open beta review
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Fetch submodule tags
        shell: bash
        run: |
          git -C core/Clash.Meta remote add metacubex https://github.com/MetaCubeX/mihomo.git 2>/dev/null || \
            git -C core/Clash.Meta remote set-url metacubex https://github.com/MetaCubeX/mihomo.git
          git -C core/Clash.Meta fetch --tags origin 2>/dev/null || true
          git -C core/Clash.Meta fetch --tags --force metacubex 2>/dev/null || true

      - name: Resolve latest stable Mihomo release
        id: latest
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          LATEST_TAG="$(gh api repos/MetaCubeX/mihomo/releases/latest --jq '.tag_name')"

          if [ -z "$LATEST_TAG" ] || ! [[ "$LATEST_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Unexpected Mihomo release tag: $LATEST_TAG"
            exit 1
          fi

          echo "tag=$LATEST_TAG" >> "$GITHUB_OUTPUT"
          echo "version=${LATEST_TAG#v}" >> "$GITHUB_OUTPUT"
          echo "Latest stable Mihomo release: $LATEST_TAG"

      - name: Compare current core version
        id: current
        shell: bash
        run: |
          CURRENT_VERSION="$(git -C core/Clash.Meta describe --tags --abbrev=0 2>/dev/null || true)"
          CURRENT_COMMIT="$(git -C core/Clash.Meta rev-parse --short=12 HEAD)"

          if [ -z "$CURRENT_VERSION" ]; then
            echo "Could not resolve current Mihomo version from git tag."
            exit 1
          fi

          CURRENT_VERSION="${CURRENT_VERSION#v}"
          echo "version=$CURRENT_VERSION" >> "$GITHUB_OUTPUT"
          echo "commit=$CURRENT_COMMIT" >> "$GITHUB_OUTPUT"
          echo "Current Mihomo core: v$CURRENT_VERSION ($CURRENT_COMMIT)"

      - name: Stop when already up to date
        if: ${{ inputs.force != true && inputs.dry_run != true && steps.current.outputs.version == steps.latest.outputs.version }}
        shell: bash
        run: |
          echo "Mihomo core is already at ${{ steps.latest.outputs.tag }}."

      - name: Setup Go for update
        if: ${{ inputs.force == true || inputs.dry_run == true || steps.current.outputs.version != steps.latest.outputs.version }}
        uses: actions/setup-go@v5
        with:
          go-version: "1.24.0"
          cache-dependency-path: |
            core/go.sum

      - name: Update Mihomo submodule
        if: ${{ inputs.force == true || inputs.dry_run == true || steps.current.outputs.version != steps.latest.outputs.version }}
        id: update
        shell: bash
        run: |
          set -euo pipefail

          LATEST_TAG="${{ steps.latest.outputs.tag }}"
          LATEST_VERSION="${{ steps.latest.outputs.version }}"
          BRANCH="codex/mihomo-core-${LATEST_TAG}"
          DRY_RUN="${{ inputs.dry_run == true }}"

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git switch -c "$BRANCH"

          git -C core/Clash.Meta remote add metacubex https://github.com/MetaCubeX/mihomo.git 2>/dev/null || \
            git -C core/Clash.Meta remote set-url metacubex https://github.com/MetaCubeX/mihomo.git
          git -C core/Clash.Meta fetch --tags --force metacubex

          git -C core/Clash.Meta checkout -q "$LATEST_TAG"

          (cd core && go mod tidy)

          NEW_COMMIT="$(git -C core/Clash.Meta rev-parse --short=12 HEAD)"

          git add core/Clash.Meta core/go.mod core/go.sum
          if git diff --cached --quiet; then
            echo "No update changes were produced."
            echo "mihomo_commit=$NEW_COMMIT" >> "$GITHUB_OUTPUT"
            echo "dry_run=$DRY_RUN" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ "$DRY_RUN" = "true" ]; then
            echo "Dry run enabled. Leaving update changes uncommitted for validation."
            git diff --cached --stat
            echo "mihomo_commit=$NEW_COMMIT" >> "$GITHUB_OUTPUT"
            echo "dry_run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git commit -m "chore: update mihomo core to $LATEST_TAG"

          echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"
          echo "mihomo_commit=$NEW_COMMIT" >> "$GITHUB_OUTPUT"
          echo "dry_run=false" >> "$GITHUB_OUTPUT"

      - name: Set up Java for validation
        if: ${{ steps.update.outputs.mihomo_commit != '' }}
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Flutter for validation
        if: ${{ steps.update.outputs.mihomo_commit != '' }}
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.41.9
          cache: true

      - name: Setup NDK for validation
        if: ${{ steps.update.outputs.mihomo_commit != '' }}
        id: setup_ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r28c
          add-to-path: true
          link-to-sdk: true

      - name: Validate core update
        if: ${{ steps.update.outputs.mihomo_commit != '' }}
        shell: bash
        env:
          ANDROID_NDK: ${{ steps.setup_ndk.outputs.ndk-path }}
          APP_ENV: stable
          PROJECT_DIR: ${{ github.workspace }}
        run: |
          set -euo pipefail

          flutter pub get
          (
            cd plugins/setup/buildkit/build_tool
            dart pub get
            dart run bin/build_tool.dart \
              --root-dir "$GITHUB_WORKSPACE" patch-mihomo
          )
          # Keep analyzer errors blocking while allowing the repository's existing
          # warning/info baseline to be handled independently of core updates.
          flutter analyze --no-fatal-warnings --no-fatal-infos
          flutter test test/mihomo/runtime_config_regression_test.dart
          flutter test test/mihomo/source_config_preservation_test.dart
          flutter test test/mihomo/runtime_config_ownership_test.dart
          flutter test test/models/profile_atomic_write_test.dart
          flutter test test/core/controller_test.dart
          flutter test test/mihomo/structural_config_diff_test.dart
          flutter test test/mihomo/script_source_preservation_test.dart
          flutter test test/mihomo/e2e_compatibility_test.dart

          cd core
          go mod tidy
          git diff --exit-code go.mod go.sum
          cd ..

          # The wrapper is Android-specific and cannot be tested as a Linux
          # executable. Test the patched Mihomo package here; the arm64 build
          # below validates the complete wrapper and native library.
          (cd core/Clash.Meta && go test ./tunnel/statistic)
          (cd core && go test ./configfixture)

          flutter build apk --debug --target-platform android-arm64

          ACTUAL_VERSION="$(git -C core/Clash.Meta describe --tags --abbrev=0)"
          if [ "$ACTUAL_VERSION" != "${{ steps.latest.outputs.tag }}" ]; then
            echo "Core version mismatch: expected ${{ steps.latest.outputs.tag }}, got $ACTUAL_VERSION"
            exit 1
          fi

          echo "Core update validation completed for $ACTUAL_VERSION."

      - name: Push validated update branch
        if: ${{ steps.update.outputs.branch != '' && steps.update.outputs.dry_run != 'true' }}
        shell: bash
        run: |
          git push --force-with-lease origin "${{ steps.update.outputs.branch }}"

      - name: Open pull request
        if: ${{ steps.update.outputs.branch != '' && steps.update.outputs.dry_run != 'true' }}
        id: pr
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          BRANCH="${{ steps.update.outputs.branch }}"
          TITLE="chore: update Mihomo core to ${{ steps.latest.outputs.tag }}"

          BODY_FILE="$(mktemp)"
          cat > "$BODY_FILE" <<EOF
          ## Mihomo Core Update

          - Previous: v${{ steps.current.outputs.version }} (${{ steps.current.outputs.commit }})
          - New: ${{ steps.latest.outputs.tag }} (${{ steps.update.outputs.mihomo_commit }})

          Core source is checked out directly from the official \`MetaCubeX/mihomo\` stable release tag.
          This update passed config regression tests, analysis, Go checks, and
          Android arm64 build validation before this draft PR was opened.
          EOF

          EXISTING_PR="$(gh pr list --head "$BRANCH" --base beta --state open --json number --jq '.[0].number // empty')"
          if [ -n "$EXISTING_PR" ]; then
            PR_NUMBER="$EXISTING_PR"
            gh pr edit "$PR_NUMBER" --title "$TITLE" --body-file "$BODY_FILE"
          else
            PR_URL="$(gh pr create --draft --base beta --head "$BRANCH" --title "$TITLE" --body-file "$BODY_FILE")"
            PR_NUMBER="$(echo "$PR_URL" | grep -oE '[0-9]+$')"
          fi

          echo "pr_number=$PR_NUMBER" >> "$GITHUB_OUTPUT"
          echo "PR #$PR_NUMBER created/updated"

      - name: Summary
        if: always()
        shell: bash
        run: |
          echo "## Mihomo Core Update Summary" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- Latest Mihomo: ${{ steps.latest.outputs.tag }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Previous core: v${{ steps.current.outputs.version }}" >> "$GITHUB_STEP_SUMMARY"
          if [ "${{ steps.update.outputs.dry_run }}" = "true" ]; then
            echo "- Status: dry run validated" >> "$GITHUB_STEP_SUMMARY"
            echo "- Mihomo commit: ${{ steps.update.outputs.mihomo_commit }}" >> "$GITHUB_STEP_SUMMARY"
            echo "- PR/tag/release: skipped" >> "$GITHUB_STEP_SUMMARY"
          elif [ "${{ steps.update.outputs.branch }}" != "" ]; then
            echo "- PR: #${{ steps.pr.outputs.pr_number }}" >> "$GITHUB_STEP_SUMMARY"
            echo "- Status: draft PR opened against beta; manual review required" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "- No update needed" >> "$GITHUB_STEP_SUMMARY"
          fi
