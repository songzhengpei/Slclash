name: Unified backup validation

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
          submodules: recursive
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Flutter environment
        run: flutter --version
      - name: Resolve dependencies
        run: flutter pub get
      - name: Prepare validation output
        run: mkdir -p validation
      - name: Apply legacy database adapter correction
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('lib/services/backup_restore/legacy_parser.dart')
          source = path.read_text()
          replacements = {
              "final rules = await legacyDatabase.rules\n          .all()\n          .map((item) => item.toRule())\n          .get();": "final rules = await legacyDatabase\n          .select(legacyDatabase.rules)\n          .map((item) => item.toRule())\n          .get();",
              "final links = await legacyDatabase.profileRuleLinks\n          .all()\n          .map((item) => item.toLink())\n          .get();": "final links = await legacyDatabase\n          .select(legacyDatabase.profileRuleLinks)\n          .map((item) => item.toLink())\n          .get();",
              "final proxyGroups = await legacyDatabase.proxyGroups\n          .all()\n          .map((item) => item.toProxyGroup())\n          .get();": "final proxyGroups = await legacyDatabase\n          .select(legacyDatabase.proxyGroups)\n          .map((item) => item.toProxyGroup())\n          .get();",
          }
          for old, new in replacements.items():
              source = source.replace(old, new)
          path.write_text(source)
          PY
      - name: Format changed Dart files and capture patch
        id: format
        continue-on-error: true
        shell: bash
        run: |
          mapfile -t files < <(git diff --name-only origin/main...HEAD -- '*.dart')
          printf '%s\n' "${files[@]}" > validation/changed-dart-files.txt
          dart format "${files[@]}" > validation/format.log 2>&1
          status=$?
          git diff --binary -- "${files[@]}" > validation/format.patch
          exit $status
      - name: Generate code
        id: generate
        continue-on-error: true
        run: dart run build_runner build --delete-conflicting-outputs > validation/build_runner.log 2>&1
      - name: Analyze
        id: analyze
        continue-on-error: true
        run: flutter analyze > validation/analyze.log 2>&1
      - name: Test
        id: test
        continue-on-error: true
        run: flutter test > validation/test.log 2>&1
      - name: Build Android debug APK
        id: build
        continue-on-error: true
        run: flutter build apk --debug > validation/apk-build.log 2>&1
      - name: Commit formatted and generated files
        if: steps.format.outcome == 'success' && steps.generate.outcome == 'success' && steps.analyze.outcome == 'success' && steps.test.outcome == 'success' && steps.build.outcome == 'success'
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add lib test
          if ! git diff --cached --quiet; then
            git commit -m 'fix(backup): format and finalize restore integration'
            git push origin HEAD:${{ github.head_ref }}
          fi
      - name: Record validation summary
        if: always()
        run: |
          printf 'format=%s\ngenerate=%s\nanalyze=%s\ntest=%s\nbuild=%s\n' \
            '${{ steps.format.outcome }}' \
            '${{ steps.generate.outcome }}' \
            '${{ steps.analyze.outcome }}' \
            '${{ steps.test.outcome }}' \
            '${{ steps.build.outcome }}' > validation/summary.txt
          git status --short > validation/git-status.txt
      - name: Upload validation output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unified-backup-validation-output
          path: validation
      - name: Upload debug APK
        if: steps.build.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: slclash-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
      - name: Enforce validation result
        if: always()
        run: |
          test '${{ steps.format.outcome }}' = success
          test '${{ steps.generate.outcome }}' = success
          test '${{ steps.analyze.outcome }}' = success
          test '${{ steps.test.outcome }}' = success
          test '${{ steps.build.outcome }}' = success
