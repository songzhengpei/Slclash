name: Unified backup validation

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Flutter environment
        run: flutter --version
      - name: Resolve dependencies
        run: flutter pub get
      - name: Prepare validation output
        run: mkdir -p validation
      - name: Format and capture patch
        run: |
          dart format lib test > validation/format.log 2>&1
          git diff --binary -- lib test > validation/format.patch
      - name: Generate code
        id: generate
        continue-on-error: true
        run: dart run build_runner build --delete-conflicting-outputs > validation/build_runner.log 2>&1
      - name: Analyze
        id: analyze
        continue-on-error: true
        run: flutter analyze > validation/analyze.log 2>&1
      - name: Test
        id: test
        continue-on-error: true
        run: flutter test > validation/test.log 2>&1
      - name: Build Android debug APK
        id: build
        continue-on-error: true
        run: flutter build apk --debug > validation/apk-build.log 2>&1
      - name: Record validation summary
        if: always()
        run: |
          printf 'generate=%s\nanalyze=%s\ntest=%s\nbuild=%s\n' \
            '${{ steps.generate.outcome }}' \
            '${{ steps.analyze.outcome }}' \
            '${{ steps.test.outcome }}' \
            '${{ steps.build.outcome }}' > validation/summary.txt
          git status --short > validation/git-status.txt
      - name: Upload validation output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unified-backup-validation-output
          path: validation
      - name: Upload debug APK
        if: steps.build.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: slclash-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
      - name: Enforce validation result
        if: always()
        run: |
          test '${{ steps.generate.outcome }}' = success
          test '${{ steps.analyze.outcome }}' = success
          test '${{ steps.test.outcome }}' = success
          test '${{ steps.build.outcome }}' = success
