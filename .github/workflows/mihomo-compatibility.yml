name: Mihomo Compatibility Gate

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - core/**
      - lib/core/**
      - lib/providers/action.dart
      - lib/common/task.dart
      - lib/models/clash_config.dart
      - lib/services/mihomo_config/**

concurrency:
  group: mihomo-compatibility-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  compatibility:
    name: Mihomo compatibility suite
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.24.0"
          cache-dependency-path: core/go.sum

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.41.9
          cache: true

      # The core bridge depends on proxy-only-traffic.patch; validation must
      # run against the same patched tree the release build uses.
      - name: Apply Mihomo patch
        shell: bash
        run: |
          set -euo pipefail
          flutter pub get
          (
            cd plugins/setup/buildkit/build_tool
            dart pub get
            dart run bin/build_tool.dart \
              --root-dir "$GITHUB_WORKSPACE" patch-mihomo
          )

      - name: Dart compatibility tests
        shell: bash
        run: |
          set -euo pipefail
          flutter analyze --no-fatal-warnings --no-fatal-infos
          flutter test test/mihomo/runtime_config_regression_test.dart
          flutter test test/mihomo/source_config_preservation_test.dart
          flutter test test/mihomo/runtime_config_ownership_test.dart
          flutter test test/models/profile_atomic_write_test.dart
          flutter test test/core/controller_test.dart
          flutter test test/mihomo/structural_config_diff_test.dart
          flutter test test/mihomo/script_source_preservation_test.dart
          flutter test test/mihomo/e2e_compatibility_test.dart

      - name: Go RawConfig bridge tests
        shell: bash
        run: |
          set -euo pipefail
          cd core
          go mod tidy
          git diff --exit-code go.mod go.sum
          go test ./configfixture
